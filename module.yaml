# park-writing 模块清单：工作台只认这个文件。流程有哪几步、顺序、每步读哪一段、过什么关卡，都在这里定。
# 格式说明见 MODULE.md。改了这里，工作台下一次读就是新的，不用改工作台代码。
module: park-writing
version: 1

# 默认流程。顺序固定，用户只能开关（10/9 定的）。工作台里最多存 2 个，这里是出厂的两个。
# 每一步有 round：1 = 第一轮，一次调用，先打分再给「修改清单」（在他的原文上直接改、留痕，他逐条接受，没有评论）；2 = 第二轮，发前 QA。
# 一次调用做几步，由 round 决定，不是一步一次（10/12 Park：一个按钮不等于一次调用）。
flows:
  流程1:
    - opening
    - density
    - scarcity
    - ending
    - style
    - check-pain
    - check-benefit
    - check-resonance
    - check-complete
    - check-typo
  流程2:
    - opening
    - style
    - check-complete
    - check-typo

# 每一步的产出之后都要过的门（约束）。数字是这里定的，工作台另有硬顶，这里写得再松也不会超过它。
constraints:
  max-change-pct: 20     # 出厂建议：删和改合计不超过原文的这个百分比。工作台里的预算在页面上定（默认 20，最多 50），以页面为准
  keep-order: true       # 段落顺序和原文一样；开头那一步允许把一句挪到最前面
  original-words: true   # 只用他的原词，不换说法
  no-new-facts: true     # 不加原文没有的数字、经历、人名；新写的字每处标出来

steps:
  # ---- 写 ----
  opening:
    title: 开头
    group: 写
    round: 1
    status: whole        # whole = 规则已经写好，但还在大文件的一段里，没拆成单独的文件
    prompt: references/开头.md#三种开头
    does: 第一句是判断，不铺垫；把文中最有力的一句挪到最前面
    output: changes      # changes = 打分 + 修改清单（直接改，留痕）；article = 改好的整篇；report = 只标不改；verdict = 只判断过不过
    fix: edit            # edit = 直接改；comment = 只评论、不改稿
    may-move: first-sentence   # 这一步允许挪的东西，其他步不能挪
    on-fail: warn

  density:
    title: 高密度骨架
    group: 写
    round: 1
    status: whole
    prompt: references/密度.md          # 整份：逻辑、四种息、文章和口播的区别；这一步只做文章
    does: 找出关键点；每一段付给读者什么（数字、判断、可用的方法、画面）；约每 60 字要有新东西。没付息的段，在后面加一句概括他已经说过的意思；只加，不删（10/12 他定的）
    output: changes
    fix: edit
    may-add: bridge-sentence
    on-fail: warn

  scarcity:
    title: 稀缺
    group: 写
    round: 1
    status: split
    prompt: references/共鸣与稀缺.md#稀缺
    does: 让读者感觉到只有他能讲这个：把最稀缺的证据（自己的数字、亲历、独有的判断）放显眼；文中没有就提示他补，不编
    output: changes
    fix: edit
    may-add: bridge-sentence   # 这一步允许新加的东西：一句衔接，最多两三句，标出来给他确认（10/12 他定的）
    on-fail: warn

  ending:
    title: 结尾钩子
    group: 写
    round: 1
    status: whole
    prompt: references/骨架.md#结尾
    does: 回扣开头那句，或落回「人要先了解自己」；用文中的话，不喊关注、不推课
    output: changes
    fix: edit
    may-add: bridge-sentence   # 钩子可以是一句新写的话，但只能用文中的词（代码核对）
    on-fail: warn

  # ---- 风格 ----
  style:
    title: 11 条风格
    group: 风格
    round: 1
    status: whole
    prompt: SKILL.md#第 4 步 整理
    does: 按 11 点放大（只挪不换词）；删口癖、复读、读者看不到的指代；加粗重点句。全篇只有这一步能删（10/12 他定的）
    output: changes
    fix: edit
    may-delete: true
    on-fail: warn

  # ---- 查：先打分，再提修改 ----
  check-pain:
    title: 有没有真痛点
    group: 查
    round: 1
    status: whole
    prompt: references/QA.md#价值
    only: [长文, 长帖]
    does: 开头一屏内，读者能看出这是在解决他的哪个具体问题；不够就把文中最接近的那句挪前或加一句衔接
    output: changes
    fix: edit
    may-add: bridge-sentence
    on-fail: warn

  check-benefit:
    title: 够不够利他
    group: 查
    round: 1
    status: whole
    prompt: references/QA.md#价值
    only: [长文, 长帖]
    does: 有没有解法；读完值不值得收藏；缺的只能提示他补，不编
    output: changes
    fix: edit
    on-fail: warn

  check-resonance:
    title: 共鸣面够不够大
    group: 查
    round: 1
    status: split
    prompt: references/共鸣与稀缺.md#共鸣面
    only: [长文, 长帖]
    does: 讲的是一行的事，别的行的人能不能看出和自己有关；不够就加一句衔接，把受众扩开
    output: changes
    fix: edit
    may-add: bridge-sentence
    on-fail: warn

  check-complete:
    title: 完整度五项
    group: 查
    round: 1
    status: whole
    prompt: references/QA.md#完整度
    only: [长文, 长帖]
    does: 开头、递进、结尾、编号、指代，站在陌生读者角度逐项打分；只评论，不替他补内容
    output: changes
    fix: comment
    on-fail: swap-if-ending-unfinished   # 结尾没写完的自动换下一篇，其他只标红（10/12 他定的）

  # ---- 第二轮：发前 QA ----
  check-typo:
    title: 错字通顺和导语
    group: 查
    round: 2
    status: whole
    prompt: references/QA.md#只允许改这几种
    does: 改错字、补不通顺的、导语让人一眼看懂这是什么；一处一处列出来，和别的修改一起留痕
    output: article
    fix: edit
    on-fail: warn

# ---- 评判清单（10/13 Park 定）：视频和文字同一张 9 项，每项 0–10 分，写一句为什么，指到原文哪一句 ----
# from = 这一项由哪几步的规则来打分。工作台读这里：第一轮只给 from 里有第一轮步骤的项打分；
# 所有 from 都是第二轮的项（错字通顺和导语）第一轮不打，工作台显示「发文章前才查」。
# 清单里没有 review 的老版本：工作台退回原来的六项打分，不报错。
review:
  - id: retain
    title: 留人
    from: [opening]
  - id: pain
    title: 痛点与共鸣
    from: [check-pain, check-resonance]
  - id: density
    title: 密度
    from: [density]
  - id: benefit
    title: 利他
    from: [check-benefit]
  - id: scarcity
    title: 稀缺
    from: [scarcity]
  - id: egg
    title: 鸡蛋
    from: [ending]
  - id: tone
    title: 口气
    from: [style]
  - id: complete
    title: 完整度
    from: [check-complete]
  - id: typo
    title: 错字通顺和导语
    from: [check-typo]

# ---- 拍后批注（10/13 Park 定）：录完、字幕放进项目后，用同一张清单只打分、只批注，一个字不改 ----
# 批注写成「下一条要注意的」，下一条口述前提醒他。引用的原话必须在字幕里（工作台逐句核对，对不上的丢掉）。
post-shoot:
  title: 拍后批注
  prompt: references/视频框架.md#评判
  does: 按 9 项清单给拍完的视频打分，每项指到字幕里的哪一句；最后写 1–5 条「下一条要注意的」。只批注，不改稿，不让他补拍
