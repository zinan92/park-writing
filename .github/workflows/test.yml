# 10/17 Park：测试一律跑在 Park 自己的 Mac 上（self-hosted runner，标签 park-mac），不花 GitHub Actions 的钱；
# 只在 PR 上跑（合并后不再重跑一遍），同一个 PR 推了新提交就取消上一轮。Mac 睡着时检查会排队等它醒。
name: test
on:
  pull_request:
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, park-mac]
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12（用 Mac 上的 uv 开一个这次专用的虚拟环境；setup-python 只认 GitHub 自己的机器）
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/uv venv --seed --clear --python 3.12 "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
